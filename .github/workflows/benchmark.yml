---
name: Calculate benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  package-size:
    if: startsWith(github.head_ref, 'release-please') == false
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Read primary Node version
        id: node
        run: echo "version=$(yq eval '.primary_node_version' .github/test-matrix.yml)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      # `npm pack` only produces a representative tarball once `dist` exists.
      - name: Build
        run: npm run build

      # Packs the CLI and installs it like a user would, then reports download size, installed size
      # and dependency count for that install. See scripts/measure-size.js.
      - name: Get size and dependency count
        run: node scripts/measure-size.js

      - name: Get TypeScript conversion progress
        run: grep -r --exclude-dir="node_modules" --include="*.ts" "@ts-expect-error" . | wc -l | xargs >
          .delta.tsConversion && echo " (Number of ts-expect-error directives)" >> .delta.tsConversion

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo ${{ github.event.number }} > ./pr_number

      - name: Upload deltas
        uses: actions/upload-artifact@v7
        with:
          name: delta-action-deltas
          retention-days: 7
          include-hidden-files: true
          path: |
            .delta.*
            pr_number
